# CI for vibe-flow: the git-guards acceptance suite and the Node tests on Linux
# and macOS, the same suite on native Windows (Git Bash), the guard under the
# Python 3.9 floor, and the rollout tool test. posix (ubuntu), posix (macos),
# windows and floor must all be green before a merge.
#
# Keep it this way: read-only token, no secrets, no caches, no pull_request_target,
# actions pinned to commit SHAs, and never interpolate ${{ github.event.* }} or
# github.head_ref inside `run:`.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # The event is part of the key: a push run and the pull_request run of the same
  # branch must not cancel each other (the PR run skips its jobs for own branches).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    # A branch with an open PR runs once (on push); pull requests from forks still run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tool versions
        run: |
          uname -a
          bash --version | head -1
          git --version
          python3 --version
          node --version
          for t in lsof uuidgen sha256sum shasum; do printf '%-10s %s\n' "$t" "$(command -v "$t" || echo '- missing')"; done

      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      # The suite also runs test_pretooluse_guard.py (the guard unit cases) inside.
      - name: git-guards acceptance suite
        working-directory: plugins/vibe-flow/git-guards
        run: bash files/scripts/test-git-guards.sh

      - name: Node tests
        run: node --test tools/measure-plan-cost.test.mjs plugins/vibe-flow-vercel/scripts/wait-vercel-deploy.test.mjs

      - name: Guard latency (informational, never fails)
        working-directory: plugins/vibe-flow/git-guards
        run: |
          set +e
          B="$BASH"; H="$PWD/files/claude/hooks/monitorex-git-guard.sh"
          if command -v cygpath >/dev/null 2>&1; then B=$(cygpath -m "$BASH"); H=$(cygpath -m "$H"); fi
          GG_BASH="$B" GG_HOOK="$H" python3 - <<'PY'
          # 20 guard runs per payload through the registered wrapper; p50 and max.
          # bash is passed by absolute path: on Windows a bare "bash" can be the WSL launcher.
          import json, os, statistics, subprocess, tempfile, time
          repo = tempfile.mkdtemp(prefix="gg-latency-")
          subprocess.run(["git", "init", "-q", repo], check=True)
          subprocess.run(["git", "-C", repo, "-c", "user.email=t@t", "-c", "user.name=t",
                          "commit", "-q", "--allow-empty", "-m", "init"], check=True)
          env = dict(os.environ, CLAUDE_PROJECT_DIR=repo)
          def once(cmd):
              body = json.dumps({"tool_name": "Bash", "tool_input": {"command": cmd}, "cwd": repo}).encode()
              t0 = time.perf_counter()
              subprocess.run([os.environ["GG_BASH"], os.environ["GG_HOOK"]], input=body,
                             capture_output=True, env=env, timeout=60)
              return (time.perf_counter() - t0) * 1000
          for label, cmd in (("ls", "ls -la"), ("git add", "git add x")):
              ms = sorted(once(cmd) for _ in range(20))
              print(f"guard latency, {label:7s}: p50 {statistics.median(ms):6.0f} ms   max {ms[-1]:6.0f} ms   (20 runs)")
          PY
          true

  floor:
    # The guard must work on the oldest Python the kit supports (3.9): macOS
    # /usr/bin/python3 is 3.9.6, and Claude Code started from the Dock may find it first.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9
        # build ("The version '3.9' with architecture 'x64' was not found").
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.9 (setup-python)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Python 3.9 (macOS /usr/bin/python3 first on PATH)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/py39"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/py39/python3"
          echo "$RUNNER_TEMP/py39" >> "$GITHUB_PATH"

      - name: The interpreter is 3.9
        run: |
          command -v python3
          python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), "not the 3.9 floor"'

      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: Guard unit cases under 3.9
        working-directory: plugins/vibe-flow/git-guards
        run: python3 files/scripts/git-guards/test_pretooluse_guard.py

      - name: Guard cases of the suite under 3.9
        working-directory: plugins/vibe-flow/git-guards
        run: GG_SUITE_ONLY=guard GG_TEST_PY39="$(command -v python3)" bash files/scripts/test-git-guards.sh

  rollout:
    # Its own job: the rollout test runs the whole git-guards suite inside every
    # prepared project (~13 min on a fast Mac), so it must not hold up `posix`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the test looks up older file versions in history
          persist-credentials: false

      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: Rollout tool test
        run: bash tools/test-rollout-projects.sh

  windows:
    # Native Windows through Git for Windows (Git Bash) — supported from 1.3.0.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Environment facts
        run: |
          set +e
          echo "uname -s:               $(uname -s)"
          echo "pwd -P:                 $(pwd -P)"
          echo "git --show-toplevel:    $(git rev-parse --show-toplevel)"
          echo "git --git-common-dir:   $(git rev-parse --git-common-dir)"
          echo "git --absolute-git-dir: $(git rev-parse --absolute-git-dir)"
          for t in python3 python py cygpath lsof netstat uuidgen shasum sha256sum stat mktemp timeout tasklist taskkill; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo '- missing')"
          done
          python3 -c ''; echo "python3 -c '' -> exit $?"
          python -c 'import sys; print("python:", sys.version.split()[0], "stdout encoding:", sys.stdout.encoding)'
          cmd //c exit 9009; echo "cmd //c exit 9009 -> \$? as Git Bash sees it: $?"
          cygpath --version 2>&1 | head -1
          stat --version 2>&1 | head -1
          git --version
          echo "core.autocrlf:"; git config --show-origin --get-all core.autocrlf
          echo "TMPDIR=${TMPDIR:-<unset>}  TMP=${TMP:-<unset>}"
          git ls-files --eol plugins/vibe-flow/git-guards/files/scripts/wt-new.sh \
            plugins/vibe-flow/git-guards/files/githooks/pre-push plugins/vibe-flow/scripts/init.sh
          d=$(mktemp -d); echo x > "$d/target"; ln -s "$d/target" "$d/link"
          if [ -L "$d/link" ]; then echo "ln -s: real symlink"; else echo "ln -s: copy, not a symlink"; fi
          sleep 30 & p=$!; echo "msys pid $p -> /proc/$p/winpid: $(cat "/proc/$p/winpid" 2>/dev/null || echo '- missing')"; kill "$p"
          true

      - name: Git identity for the test repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: git-guards suite
        working-directory: plugins/vibe-flow/git-guards
        run: bash files/scripts/test-git-guards.sh 2>&1 | tee "$RUNNER_TEMP/windows-suite.log"

      - name: Guard unit cases (test_pretooluse_guard.py)
        working-directory: plugins/vibe-flow/git-guards
        run: python3 files/scripts/git-guards/test_pretooluse_guard.py

      - name: Guard latency (informational, never fails)
        working-directory: plugins/vibe-flow/git-guards
        run: |
          set +e
          B="$BASH"; H="$PWD/files/claude/hooks/monitorex-git-guard.sh"
          if command -v cygpath >/dev/null 2>&1; then B=$(cygpath -m "$BASH"); H=$(cygpath -m "$H"); fi
          GG_BASH="$B" GG_HOOK="$H" python3 - <<'PY'
          # 20 guard runs per payload through the registered wrapper; p50 and max.
          # bash is passed by absolute path: on Windows a bare "bash" can be the WSL launcher.
          import json, os, statistics, subprocess, tempfile, time
          repo = tempfile.mkdtemp(prefix="gg-latency-")
          subprocess.run(["git", "init", "-q", repo], check=True)
          subprocess.run(["git", "-C", repo, "-c", "user.email=t@t", "-c", "user.name=t",
                          "commit", "-q", "--allow-empty", "-m", "init"], check=True)
          env = dict(os.environ, CLAUDE_PROJECT_DIR=repo)
          def once(cmd):
              body = json.dumps({"tool_name": "Bash", "tool_input": {"command": cmd}, "cwd": repo}).encode()
              t0 = time.perf_counter()
              subprocess.run([os.environ["GG_BASH"], os.environ["GG_HOOK"]], input=body,
                             capture_output=True, env=env, timeout=60)
              return (time.perf_counter() - t0) * 1000
          for label, cmd in (("ls", "ls -la"), ("git add", "git add x")):
              ms = sorted(once(cmd) for _ in range(20))
              print(f"guard latency, {label:7s}: p50 {statistics.median(ms):6.0f} ms   max {ms[-1]:6.0f} ms   (20 runs)")
          PY
          true

      - name: Keep the suite log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-suite-log
          path: ${{ runner.temp }}/windows-suite.log
          if-no-files-found: warn
